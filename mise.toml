[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"
lefthook = "2.2.2"
cocogitto = "7.0.0"
goreleaser = "2.20.0"
actionlint = "1.7.12"

[env]
GOTOOLCHAIN = "local"
GOFLAGS = "-mod=readonly"
MACOSX_DEPLOYMENT_TARGET = "13.0"
CGO_CFLAGS = "-O2 -g -mmacosx-version-min=13.0"

[tasks.bootstrap]
description = "Prepare module dependencies and install repository hooks"
run = ["go mod download", "lefthook install"]

[tasks.check]
description = "Run format, lint, build, race tests, module verification, and vulnerability audit"
depends = ["fmt-check", "lint", "build", "test", "audit"]
run = "go mod verify"

[tasks.lint]
description = "Validate configuration and analyze Go packages"
run = ["golangci-lint config verify", "sh scripts/go-check.sh lint"]

[tasks.fmt]
description = "Format Go source and imports"
run = "sh scripts/go-check.sh fmt"

[tasks.fmt-check]
description = "Check formatting without modifying files"
run = "sh scripts/go-check.sh fmt-check"

[tasks.test]
description = "Run Go tests with the race detector"
run = "sh scripts/go-check.sh test"

[tasks.build]
description = "Build pbjc and pbjp executables"
run = "sh scripts/go-check.sh build"

[tasks.audit]
description = "Scan reachable Go code for known vulnerabilities (network required)"
run = "sh scripts/go-check.sh audit"

[tasks.release-check]
description = "Validate release configuration and test release tooling"
run = ["goreleaser check", "actionlint .github/workflows/release.yml", "go test ./internal/release"]

[tasks.release-snapshot]
description = "Build local-only source and macOS archives without publishing"
depends = ["release-check"]
run = "goreleaser release --snapshot --skip=publish --clean"

[tasks.release-bump]
description = "Check the repository, then let Cog update the changelog and stable version tag"
run = ["mise run check", "mise run release-check", "cog bump --auto"]
