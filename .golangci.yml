version: "2"

linters:
  # Explicit coverage keeps upgrades from silently adopting new policy.
  default: none
  enable:
    # Correctness, errors, resources, and language traps.
    - asasalint
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - govet
    - ineffassign
    - intrange
    - makezero
    - nilerr
    - nilnesserr
    - nilnil
    - reassign
    - recvcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
    # Security, including misleading Unicode identifiers and bidi controls.
    - asciicheck
    - bidichk
    - gosec
    # Test mistakes; no requirement to parallelize tests or use external packages.
    - testableexamples
    - thelper
    - usetesting
    # Readability and avoidable work.
    - dogsled
    - dupl
    - dupword
    - exptostd
    - goconst
    - godot
    - goprintffuncname
    - iface
    - interfacebloat
    - mirror
    - misspell
    - mnd
    - modernize
    - nakedret
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - usestdlibvars
    - whitespace
    # Complementary complexity budgets, not duplicate cyclomatic checks.
    - cyclop
    - funlen
    - gocognit
    - nestif
    - nolintlint

  settings:
    cyclop:
      max-complexity: 12
      package-average: 0
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 40
      ignore-comments: true
    nestif:
      min-complexity: 4
    dupl:
      threshold: 150
    errcheck:
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    goconst:
      min-len: 3
      min-occurrences: 3
      match-constant: true
      # Numeric literals belong to mnd, not a second constant detector.
      numbers: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-tags:
        - experimental
        - opinionated
    gosec:
      severity: medium
      confidence: medium
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "2"
        - "10"
        - "64"
        - "100"
        - "0644"
        - "0755"
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      # Explicit rules avoid both all-rules policy creep and implicit defaults.
      enable-default-rules: false
      directives:
        - name: specify-disable-reason
        - name: specify-disable-rule
      rules:
        - name: argument-limit
          arguments: [5]
        - name: file-length-limit
          arguments:
            - max: 500
              skip-comments: true
              skip-blank-lines: true
        - name: max-control-nesting
          arguments: [4]
        # Dedicated linters above own cognitive/cyclomatic/function complexity.
        - name: early-return
          arguments: [preserve-scope]
        - name: indent-error-flow
          arguments: [preserve-scope]
        - name: superfluous-else
          arguments: [preserve-scope]
        - name: unnecessary-if
        - name: unnecessary-stmt
        - name: flag-parameter
        - name: deep-exit
        - name: unhandled-error
        - name: unchecked-type-assertion
        - name: use-any
        - name: use-errors-new
        - name: identical-branches
        - name: unused-parameter
        - name: unused-receiver
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: range-val-in-closure
        - name: modifies-parameter
        - name: unexported-return
        - name: var-naming
        - name: error-naming
        - name: error-strings
        - name: receiver-naming
        - name: confusing-naming
        - name: import-alias-naming
        - name: package-comments

  exclusions:
    # Only the Go-standard generated marker earns an exemption.
    generated: strict
    # Do not suppress errors, comments, tests, or other handwritten code by preset.
    presets: []
    warn-unused: true
    rules:
      # cgo's generated pointer checks map identical expressions to these calls.
      # Keep all other gocritic diagnostics enabled in handwritten native code.
      - path: 'internal/pasteboard/.*_darwin\.go'
        linters: [gocritic]
        text: 'dupSubExpr: suspicious identical LHS and RHS'

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
  settings:
    gofumpt:
      module-path: github.com/the-inconvenience-store/pbj
    goimports:
      local-prefixes:
        - github.com/the-inconvenience-store/pbj
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/the-inconvenience-store/pbj)
  exclusions:
    generated: strict
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
